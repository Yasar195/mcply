[package]
name = "mcply"
version = "0.0.3"
edition = "2024"

[dependencies]
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json", "query", "stream", "blocking"] }
tokio = { version = "1", features = ["full"] }
rmcp = { version = "0.16.0", features = ["server", "transport-io", "transport-streamable-http-server", "client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
axum = "0.8"
tower = "0.4"
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
rusqlite = { version = "0.38.0", features = ["bundled"] }
ratatui = "0.30.0"
crossterm = "0.29.0"
self_update = { version = "0.41", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
semver = "1.0"

[target.'cfg(unix)'.dependencies]
flate2 = "1.0"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = "2.2"